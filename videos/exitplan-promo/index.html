<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #08090B;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29.5"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-sounds"
        class="scene"
        data-composition-id="02-sounds"
        data-composition-src="compositions/frames/02-sounds.html"
        data-start="4"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-fuse"
        class="scene"
        data-composition-id="03-fuse"
        data-composition-src="compositions/frames/03-fuse.html"
        data-start="8.5"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-call"
        class="scene"
        data-composition-id="04-call"
        data-composition-src="compositions/frames/04-call.html"
        data-start="13"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-privacy"
        class="scene"
        data-composition-id="05-privacy"
        data-composition-src="compositions/frames/05-privacy.html"
        data-start="18.5"
        data-duration="6"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="24"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <!--
        (track 10) narration — Spanish. Built from video/voz español.mp3 (ElevenLabs
        v3, 25s) by cutting it at its six phrase pauses and re-placing each phrase on
        its own scene start, so nothing drifts across a cut. Source of the cut points
        and the mapping: narration-es.md.
        Hand-mounted at the host root: the runtime only drives media that is a DIRECT
        child of index.html, and audio_meta.json models voice per frame while this is
        one file spanning all six. Re-running assemble-index.mjs drops this element —
        re-add it after any re-assembly.
      -->
      <audio
        id="el-narration"
        src="assets/audio/narration-es.mp3"
        data-start="0"
        data-duration="29.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-05-privacy", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 24);
        tl.fromTo("#el-06-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 24);
        tl.to({}, { duration: 29.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>

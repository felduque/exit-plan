<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          font-weight: 400;
          font-style: normal;
          src: url("assets/fonts/Inter-400.woff2") format("woff2");
        }
        @font-face {
          font-family: "Inter";
          font-weight: 800;
          font-style: normal;
          src: url("assets/fonts/Inter-800.woff2") format("woff2");
        }
        @font-face {
          font-family: "Inter";
          font-weight: 900;
          font-style: normal;
          src: url("assets/fonts/Inter-900.woff2") format("woff2");
        }
        @font-face {
          font-family: "JetBrains Mono";
          font-weight: 400;
          font-style: normal;
          src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2");
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          container-type: size;
          font-family: "Inter", sans-serif;
          -webkit-font-smoothing: antialiased;
        }

        .ct-ground {
          position: absolute;
          inset: 0;
          background: #08090b;
          z-index: 0;
        }

        /* --- the mark: the app's real icon, a burning fuse --- */
        .ct-icon-wrap {
          position: absolute;
          left: 300px;
          top: 460px;
          width: 480px;
          height: 480px;
          z-index: 2;
        }
        .ct-icon {
          position: absolute;
          inset: 0;
          width: 480px;
          height: 480px;
          image-rendering: auto;
        }
        /* wipes right-to-left off the mark so the fuse reads as drawing itself on */
        .ct-wipe {
          position: absolute;
          left: 0;
          top: 0;
          width: 480px;
          height: 480px;
          background: #08090b;
          transform-origin: right center;
          z-index: 3;
        }
        /* the glow that blooms behind the fuse head */
        .ct-bloom {
          position: absolute;
          left: 140px;
          top: 110px;
          width: 260px;
          height: 260px;
          border-radius: 50%;
          background: radial-gradient(
            circle,
            rgba(232, 163, 61, 0.55) 0%,
            rgba(232, 163, 61, 0.16) 42%,
            rgba(232, 163, 61, 0) 70%
          );
          z-index: 1;
        }

        .ct-rule {
          position: absolute;
          left: 492px;
          top: 880px;
          width: 96px;
          height: 4px;
          background: #e8a33d;
          transform-origin: center center;
          z-index: 2;
        }

        .ct-name {
          position: absolute;
          left: 0;
          top: 940px;
          width: 1080px;
          text-align: center;
          z-index: 2;
          font-weight: 900;
          font-size: 142px;
          line-height: 1;
          letter-spacing: -0.045em;
          color: #f2f2f3;
        }
        .ct-sub {
          position: absolute;
          left: 0;
          top: 1118px;
          width: 1080px;
          text-align: center;
          z-index: 2;
          font-weight: 400;
          font-size: 48px;
          line-height: 1.3;
          letter-spacing: 0.01em;
          color: #8a8c93;
        }

        /* the ask — the Play mark drawn as geometry + our own type.
           NOT a reproduction of Google's official badge artwork; swap in the
           official PNG from Google's brand resources for the published cut. */
        .ct-pill {
          position: absolute;
          left: 190px;
          top: 1318px;
          width: 700px;
          height: 152px;
          border: 1px solid #3a3936;
          border-radius: 14px;
          background: #101114;
          z-index: 2;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .ct-play {
          width: 76px;
          height: 76px;
          margin-right: 30px;
          flex: none;
        }
        .ct-pill-col {
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        .ct-pill-kicker {
          font-family: "JetBrains Mono", monospace;
          font-weight: 400;
          font-size: 26px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #8a8c93;
          margin-bottom: 8px;
        }
        .ct-pill-txt {
          font-weight: 700;
          font-size: 54px;
          line-height: 1;
          letter-spacing: -0.01em;
          color: #f2f2f3;
        }
      </style>

      <div
        id="root"
        data-composition-id="06-cta"
        data-start="0"
        data-duration="5.5"
        data-width="1080"
        data-height="1920"
      >
        <div
          class="ct-ground clip"
          data-start="0"
          data-duration="5.5"
          data-track-index="0"
        ></div>

        <div
          class="ct-icon-wrap clip"
          data-start="0"
          data-duration="5.5"
          data-track-index="1"
        >
          <div class="ct-bloom"></div>
          <img class="ct-icon" src="assets/app_icon_mark.png" alt="" />
          <div class="ct-wipe"></div>
        </div>

        <div
          class="ct-rule clip"
          data-start="0"
          data-duration="5.5"
          data-track-index="2"
        ></div>

        <div
          class="ct-name clip"
          data-start="0"
          data-duration="5.5"
          data-track-index="3"
        >
          ExitPlan
        </div>

        <div
          class="ct-sub clip"
          data-start="0"
          data-duration="5.5"
          data-track-index="4"
        >
          Fake Call &amp; Escape
        </div>

        <div
          class="ct-pill clip"
          data-start="0"
          data-duration="5.5"
          data-track-index="5"
        >
          <svg
            class="ct-play"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <polygon points="3.6,1.6 13.7,12 3.6,22.4" fill="#00C3FF" />
            <polygon points="3.6,1.6 17.2,8.6 13.7,12" fill="#00E676" />
            <polygon
              points="17.2,8.6 21.0,12 17.2,15.4 13.7,12"
              fill="#FFCE00"
            />
            <polygon points="3.6,22.4 13.7,12 17.2,15.4" fill="#FF3A44" />
          </svg>
          <div class="ct-pill-col">
            <div class="ct-pill-kicker">Disponible en</div>
            <div class="ct-pill-txt">Google Play</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          // immediate initial state, not a zero-duration set at t=0
          gsap.set(".ct-bloom", { opacity: 0, scale: 0.6 });

          // ---- Scene 1 (0.0-1.0): the fuse draws itself on, the head blooms ----
          tl.fromTo(
            ".ct-icon-wrap",
            { opacity: 0 },
            { opacity: 1, duration: 0.3, ease: "power2.out" },
            0,
          );
          tl.fromTo(
            ".ct-wipe",
            { scaleX: 1 },
            { scaleX: 0, duration: 0.78, ease: "power2.inOut" },
            0.12,
          );
          tl.fromTo(
            ".ct-bloom",
            { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 0.62, ease: "power3.out" },
            0.68,
          );

          // ---- Scene 2 (1.0-1.9): the name sets beneath the mark ----
          tl.fromTo(
            ".ct-name",
            { opacity: 0, y: 34 },
            { opacity: 1, y: 0, duration: 0.72, ease: "power3.out" },
            1.15,
          );

          // ---- Scene 3 (1.9-2.7): subtitle + the rule stub between mark and name ----
          tl.fromTo(
            ".ct-rule",
            { scaleX: 0, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
            2.0,
          );
          tl.fromTo(
            ".ct-sub",
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
            2.12,
          );

          // ---- Scene 4 (2.7-3.4): the ask assembles — outline first, then the words ----
          tl.fromTo(
            ".ct-pill",
            { opacity: 0, scaleX: 0.86 },
            { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" },
            2.95,
          );
          tl.fromTo(
            [".ct-play", ".ct-pill-kicker", ".ct-pill-txt"],
            { opacity: 0 },
            { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.08 },
            3.2,
          );

          // ---- Scene 5 (3.4-4.0): held lockup. The amber head stays lit. ----

          window.__timelines["06-cta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

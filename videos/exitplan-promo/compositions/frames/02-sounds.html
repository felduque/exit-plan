<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          font-weight: 400;
          font-style: normal;
          src: url("assets/fonts/Inter-400.woff2") format("woff2");
        }
        @font-face {
          font-family: "Inter";
          font-weight: 800;
          font-style: normal;
          src: url("assets/fonts/Inter-800.woff2") format("woff2");
        }
        @font-face {
          font-family: "JetBrains Mono";
          font-weight: 400;
          font-style: normal;
          src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2");
        }
        @font-face {
          font-family: "JetBrains Mono";
          font-weight: 700;
          font-style: normal;
          src: url("assets/fonts/JetBrainsMono-700.woff2") format("woff2");
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          container-type: size;
          font-family: "Inter", sans-serif;
          -webkit-font-smoothing: antialiased;
        }

        .snd-ground {
          position: absolute;
          inset: 0;
          background: #08090b;
          z-index: 0;
        }

        /* --- supporting: sound-library plate, behind and right --- */
        .snd-plate-wrap {
          position: absolute;
          left: 460px;
          top: 300px;
          width: 619px;
          height: 1100px;
          z-index: 1;
        }
        .snd-plate {
          position: absolute;
          inset: 0;
          background-image: url("assets/screenshot_3_library.png");
          background-size: 1080px 1920px;
          background-position: -231px -560px;
          background-repeat: no-repeat;
          filter: blur(3px);
          border: 1px solid #282726;
        }

        /* --- hero: app home device (device law: bezel crop) --- */
        .snd-dev-wrap {
          position: absolute;
          left: 222.5px;
          top: 69px;
          width: 635px;
          height: 1411px;
          z-index: 2;
        }
        .snd-dev {
          position: absolute;
          inset: 0;
          background-image: url("assets/screenshot_1_home.png");
          background-size: 1080px 1920px;
          background-position: -223px -478px;
          background-repeat: no-repeat;
        }

        /* amber card-glow overlays, positioned in device-local coords */
        .snd-card {
          position: absolute;
          border: 2px solid #e8a33d;
          background: rgba(232, 163, 61, 0.09);
          pointer-events: none;
        }
        .snd-c1 {
          left: 46px;
          top: 245px;
          width: 262px;
          height: 254px;
        }
        .snd-c2 {
          left: 326px;
          top: 245px;
          width: 262px;
          height: 254px;
        }
        .snd-c3 {
          left: 46px;
          top: 513px;
          width: 262px;
          height: 274px;
        }
        .snd-c4 {
          left: 326px;
          top: 513px;
          width: 262px;
          height: 274px;
        }

        /* --- caption --- */
        .snd-cap {
          position: absolute;
          left: 60px;
          top: 1418px;
          width: 960px;
          z-index: 4;
          font-family: "JetBrains Mono", monospace;
          text-transform: uppercase;
        }
        .snd-cap-a {
          font-weight: 700;
          font-size: 76px;
          letter-spacing: 0.06em;
          color: #e8a33d;
          line-height: 1.1;
        }
        .snd-cap-b {
          margin-top: 18px;
          font-weight: 400;
          font-size: 50px;
          letter-spacing: 0.13em;
          color: #f2f2f3;
          line-height: 1.2;
        }
        .snd-tok {
          display: inline-block;
        }
        .snd-rule {
          position: absolute;
          left: 60px;
          top: 1380px;
          width: 96px;
          height: 4px;
          background: #e8a33d;
          transform-origin: left center;
          z-index: 4;
        }
      </style>

      <div
        id="root"
        data-composition-id="02-sounds"
        data-start="0"
        data-duration="4.5"
        data-width="1080"
        data-height="1920"
      >
        <div
          class="snd-ground clip"
          data-start="0"
          data-duration="4.5"
          data-track-index="0"
        ></div>

        <div
          class="snd-plate-wrap clip"
          data-start="0"
          data-duration="4.5"
          data-track-index="1"
        >
          <div class="snd-plate"></div>
        </div>

        <div
          class="snd-dev-wrap clip"
          data-start="0"
          data-duration="4.5"
          data-track-index="2"
        >
          <div class="snd-dev">
            <div class="snd-card snd-c1"></div>
            <div class="snd-card snd-c2"></div>
            <div class="snd-card snd-c3"></div>
            <div class="snd-card snd-c4"></div>
          </div>
        </div>

        <div
          class="snd-rule clip"
          data-start="0"
          data-duration="4.5"
          data-track-index="3"
        ></div>

        <div
          class="snd-cap clip"
          data-start="0"
          data-duration="4.5"
          data-track-index="4"
        >
          <div class="snd-cap-a">
            <span class="snd-tok snd-t1">47</span>
            <span class="snd-tok snd-t1">sonidos</span>
          </div>
          <div class="snd-cap-b">
            <span class="snd-tok snd-t2">Timbre</span>
            <span class="snd-tok snd-t2">&middot;</span>
            <span class="snd-tok snd-t2">Alarma</span>
            <span class="snd-tok snd-t2">&middot;</span>
            <span class="snd-tok snd-t2">Sirena</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          const devWrap = document.querySelector(".snd-dev-wrap");

          // ---- Scene 1 (0.0-1.0): caption first. Nothing else on screen. ----
          tl.fromTo(
            ".snd-rule",
            { scaleX: 0, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
            0.0,
          );
          tl.fromTo(
            ".snd-t1",
            { opacity: 0, y: 22 },
            {
              opacity: 1,
              y: 0,
              duration: 0.5,
              ease: "power3.out",
              stagger: 0.1,
            },
            0.08,
          );
          tl.fromTo(
            ".snd-t2",
            { opacity: 0, y: 16 },
            {
              opacity: 1,
              y: 0,
              duration: 0.42,
              ease: "power3.out",
              stagger: 0.07,
            },
            0.5,
          );

          // ---- Scene 2 (1.0-2.1): hero device rises and settles ----
          tl.fromTo(
            ".snd-dev",
            { opacity: 0, y: 120, scale: 0.74 },
            {
              opacity: 1,
              y: 0,
              scale: 0.78,
              duration: 0.95,
              ease: "power3.out",
            },
            0.95,
          );

          // handheld: finite deterministic jitter on the WRAPPER (never the tweened layer)
          const jit = { p: 0 };
          tl.to(
            jit,
            {
              p: Math.PI * 2 * 3.0,
              duration: 3.55,
              ease: "none",
              onUpdate: () => {
                const t = jit.p;
                gsap.set(devWrap, {
                  x: Math.sin(t) * 3.2 + Math.sin(t * 1.7) * 1.4,
                  y: Math.cos(t * 0.83) * 2.6,
                  rotation: Math.sin(t * 0.61) * 0.16,
                });
              },
            },
            0.95,
          );

          // ---- Scene 3 (2.1-3.1): library plate fades up behind and SCROLLS ----
          tl.fromTo(
            ".snd-plate-wrap",
            { opacity: 0, scale: 0.58, x: 30 },
            {
              opacity: 0.42,
              scale: 0.62,
              x: 0,
              duration: 0.75,
              ease: "power3.out",
            },
            1.95,
          );
          // the list visibly keeps going — that IS the "47" proof
          tl.fromTo(
            ".snd-plate",
            { backgroundPositionY: "-560px" },
            {
              backgroundPositionY: "-790px",
              duration: 1.6,
              ease: "power1.inOut",
            },
            2.0,
          );

          // ---- Scene 4 (3.1-4.0): amber glow cascades card 01 -> 04, then holds ----
          tl.fromTo(
            [".snd-c1", ".snd-c2", ".snd-c3", ".snd-c4"],
            { opacity: 0 },
            {
              opacity: 1,
              duration: 0.3,
              ease: "power2.out",
              stagger: 0.14,
            },
            2.95,
          );

          window.__timelines["02-sounds"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

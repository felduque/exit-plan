<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-0.ttf") format("truetype"); font-weight: 400; }
        @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-1.ttf") format("truetype"); font-weight: 600; }
        @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-2.ttf") format("truetype"); font-weight: 700; }
        @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jetbrains-mono-0.ttf") format("truetype"); font-weight: 500; }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #0A0A0A;
          font-family: "Space Grotesk", sans-serif;
        }

        .brand {
          position: absolute;
          left: 64px;
          top: 180px;
          font-family: "JetBrains Mono", monospace;
          font-size: 24px;
          font-weight: 500;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: #F5A623;
        }

        .headline {
          position: absolute;
          left: 64px;
          top: 232px;
          width: 800px;
          font-size: 64px;
          font-weight: 700;
          line-height: 1.1;
          color: #FFFFFF;
        }

        .phone-wrap {
          position: absolute;
          left: 240px;
          top: 460px;
          width: 600px;
          height: 1180px;
        }

        .phone-body {
          position: absolute;
          inset: 0;
          background: #141414;
          border: 2px solid rgba(255,255,255,0.12);
          border-radius: 60px;
          box-shadow: 0 50px 120px rgba(0,0,0,0.6);
          overflow: hidden;
        }

        .phone-notch {
          position: absolute;
          top: 20px;
          left: 50%;
          transform: translateX(-50%);
          width: 170px;
          height: 30px;
          background: #000;
          border-radius: 15px;
          z-index: 3;
        }

        .phone-screen {
          position: absolute;
          top: 72px;
          left: 22px;
          right: 22px;
          bottom: 22px;
          background: #0A0A0A;
          border-radius: 40px;
          overflow: hidden;
        }

        .screen-img {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: auto;
          transform-origin: top center;
        }

        .badge {
          position: absolute;
          right: 40px;
          bottom: 80px;
          padding: 18px 30px;
          background: rgba(245,166,35,0.18);
          border: 1.5px solid #F5A623;
          border-radius: 100px;
          font-family: "JetBrains Mono", monospace;
          font-size: 22px;
          font-weight: 500;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #F5A623;
          backdrop-filter: blur(8px);
          z-index: 4;
        }

        .glow {
          position: absolute;
          right: 20px;
          bottom: 60px;
          width: 220px;
          height: 80px;
          background: radial-gradient(circle, rgba(245,166,35,0.35) 0%, rgba(245,166,35,0) 70%);
          border-radius: 50%;
          z-index: 2;
        }
      </style>

      <div id="root" data-composition-id="frame-03" data-width="1080" data-height="1920" data-layout-allow-overflow>
        <div id="f3-brand" class="clip brand" data-start="0" data-duration="5" data-track-index="1">ExitPlan</div>
        <div id="f3-headline" class="clip headline" data-start="0" data-duration="5" data-track-index="2">
          La app de llamada falsa que suena y parece real.
        </div>
        <div id="f3-phone" class="clip phone-wrap" data-start="0" data-duration="5" data-track-index="3">
          <div class="phone-body">
            <div class="phone-notch"></div>
            <div class="phone-screen">
              <img id="f3-screen-img" class="screen-img" src="assets/screen_home.png" alt="ExitPlan home" />
            </div>
            <div class="glow"></div>
            <div id="f3-badge" class="badge">Fake calls</div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#f3-brand", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.2);
        tl.fromTo("#f3-headline", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.35);
        tl.fromTo("#f3-phone", { y: 200, opacity: 0, scale: 0.86, rotation: 4 }, { y: 0, opacity: 1, scale: 1, rotation: 0, duration: 1.0, ease: "power3.out" }, 0.15);
        tl.fromTo("#f3-screen-img", { y: 0 }, { y: -360, duration: 3.0, ease: "power2.inOut" }, 0.8);
        tl.fromTo("#f3-badge", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 2.4);
        tl.fromTo(".glow", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 2.4);
        tl.to("#f3-badge", { scale: 1.06, duration: 0.7, ease: "power1.inOut", yoyo: true, repeat: 2 }, 3.0);

        window.__timelines["frame-03"] = tl;
      </script>
    </template>
  </body>
</html>

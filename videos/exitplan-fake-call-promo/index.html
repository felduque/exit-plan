<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ExitPlan — Llamada Falsa: Excusa Perfecta</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0A0A0A;
      }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-0.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-1.ttf") format("truetype"); font-weight: 600; }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-2.ttf") format("truetype"); font-weight: 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jetbrains-mono-0.ttf") format("truetype"); font-weight: 500; }
      body {
        font-family: "Space Grotesk", system-ui, sans-serif;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <audio
        id="voiceover"

        src="voiceover.mp3"
        data-start="0"
        data-duration="29.31"
        data-track-index="0"
      ></audio>
      <div
        id="scene-01"
        class="clip scene"
        data-composition-id="frame-01"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="scene-02"
        class="clip scene"

        data-composition-src="compositions/frames/02-need.html"

        data-duration="3"

        data-height="1920"
      ></div>
      <div
        id="scene-03"

      <div
        id="scene-05"

        data-start="20"
        data-duration="5"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="scene-06"
        class="clip scene"
        data-composition-id="frame-06"

        data-track-index="1"

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

            - generic [ref=e186]:
              - generic [ref=e187]: "¿Atrapado en una reunión que no termina o en una cita que no va para ningún lado? ExitPlan es la app de llamada falsa que te da una excusa creíble para irte, con un solo toque.ExitPlan simula interrupciones cotidianas realistas: una llamada falsa, un timbre, una alarma, una llamada que se corta. Todo discreto y en segundos. Elige un sonido, programa el retardo y deja que tu celular haga el resto.CÓMO FUNCIONAN LA LLAMADA FALSA Y LOS SONIDOS DE SALIDA1. Elige tu salida: 47 sonidos de alta calidad pensados para sonar creíbles en un cuarto en silencio.2. Programa el retardo: 5, 10 o 30 segundos, para que no parezca que lo activaste tú.3. Pantalla en negro: al dispararse, la pantalla se apaga por completo, como si el celular estuviera guardado.4. Sal de ahí: la llamada falsa, la alarma o el timbre se disparan de fondo y te dan la excusa.LLAMADAS FALSAS QUE PARECEN REALESCrea un contacto falso con nombre, número y una foto de tu galería, y elige si la pantalla de llamada entrante debe verse como iOS, Android o WhatsApp. Haz que suene cuando lo necesites, contéstala de verdad y cuelga cuando quieras irte. La foto nunca sale de tu teléfono.CUÁNDO SE USA EXITPLAN- Una primera cita que no está funcionando- Una reunión o una clase que se alarga- Un vendedor o una visita a domicilio que no pediste- Una cena familiar o una fiesta de la que quieres irte temprano- Cualquier conversación incómoda en la que necesitas una salida amable- Un momento en el que simplemente quieres sentirte más seguro al irteCATEGORÍAS DE SONIDOS INCLUIDAS- Sonidos de timbre: campanas y timbres realistas, como si alguien acabara de llegar.- Sonidos de alarma: sirenas, despertadores y pitidos de emergencia para justificar una salida rápida.- Sin señal: cortes, estática e interferencias para colgar una llamada a media frase.- Eléctrico: cortocircuitos y zumbidos para simular un apagón.- Fuego: crepitar de llamas para una emergencia real.- Tormenta: truenos, lluvia fuerte y viento, para tener que ir a revisar la casa.TUS PROPIOS SONIDOSImporta cualquier archivo de audio de tu dispositivo, recorta con el editor de onda el fragmento exacto que quieras, ponle una etiqueta y un ícono, y guárdalo como una salida más junto a las que ya vienen.CARACTERÍSTICAS- Pantalla de llamada falsa en estilo iOS, Android y WhatsApp- Identificador de llamada falso con nombre, número y foto propios- Cuatro accesos directos en la pantalla de inicio, siempre a un toque- 47 sonidos de alarma falsa, timbre, sirena y emergencia en 6 categorías- Retardo de 0, 5, 10 o 30 segundos- Reproducción una vez, 30 segundos o hasta que tú la detengas- Pantalla completamente en negro mientras suena- Importación de audio con recorte por onda- Etiquetas e íconos personalizados para tus propias salidas- Vibración háptica y volumen máximo forzado- Controles en la pantalla de bloqueo que mantienen el audio activoPRIVACIDAD PRIMEROExitPlan funciona totalmente sin conexión. Sin cuenta, sin registro, sin recolección de datos, sin acceso al micrófono y sin grabar nada. Tus sonidos y las fotos de contacto nunca salen de tu dispositivo.ExitPlan es una herramienta de conveniencia personal, no una app para acosar a nadie. No es un servicio de emergencias y no contacta a nadie en tu nombre. Si estás en peligro, llama al número de emergencias de tu país."
